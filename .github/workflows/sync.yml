name: Sync index

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [pack-updated]

permissions:
  contents: write

concurrency:
  group: standard-pack-index-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Build index
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REQUESTED_REPOSITORY: ${{ github.event.client_payload.repository }}
        run: |
          if [[ -n "$REQUESTED_REPOSITORY" ]]; then
            python scripts/build_index.py --repository "$REQUESTED_REPOSITORY"
          else
            python scripts/build_index.py
          fi
      - run: python scripts/validate_index.py
      - name: Publish changed index
        run: |
          if git diff --quiet -- index.json; then
            echo "Index is already current"
            exit 0
          fi
          git config user.name "attune-index[bot]"
          git config user.email "attune-index[bot]@users.noreply.github.com"
          git add index.json
          git commit -m "Update standard pack index"
          git push
